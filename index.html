<!DOCTYPE html>
<html lang="en">

<head>
    <link href="./assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="./assets/css/boggle.css" rel="stylesheet">
    <title>Boggle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <script src="./assets/js/jquery-3.7.1.min.js"></script>
    <script src="./assets/js/sweetalert2.all.min.js"></script>
    <script src="./assets/js/leader-line.min.js"></script>
</head>

<body data-bs-theme="dark">
    <nav class="navbar sticky-top bg-body">
        <div class="container">
            <span class="navbar-brand" href="#">Boogle</span>
            <button onclick="resetGame()" class="btn btn-danger">Reset</button>
        </div>
    </nav>
    <main class="container">
        <!-- Letter Grid -->
        <span>Current Score
            <pre id="currentScore">0</pre>
        </span><span>Time Left
            <pre id="timer">60</pre>
        </span>
        <input id="letterbox" tabindex="-1">
        <div class="row">
            <table id="grid" class="col-auto order-2 px-0">
                <tr id="tr0">
                    <td class="box"></td>
                    <td class="box"></td>
                    <td class="box"></td>
                    <td class="box"></td>
                </tr>
                <tr id="tr1">
                    <td class="box"></td>
                    <td class="box"></td>
                    <td class="box"></td>
                    <td class="box"></td>
                </tr>
                <tr id="tr2">
                    <td class="box"></td>
                    <td class="box"></td>
                    <td class="box"></td>
                    <td class="box"></td>
                </tr>
                <tr id="tr3">
                    <td class="box"></td>
                    <td class="box"></td>
                    <td class="box"></td>
                    <td class="box"></td>
                </tr>
            </table>
            <!--Right Side-->
            <output id="wordList" class="col-sm order-3 bg-light px-0">
                <table class="table table-light table-hover" id="queue">
                    <tr>
                        <th>Word</th>
                        <th>Status</th>
                        <th>Points</th>
                    </tr>
                </table>
            </output>
        </div>
    </main>
    <script src="./assets/js/ext.js" type="text/javascript"></script>
    <script src="./assets/js/boggle.js" type="text/javascript"></script>
</body>

</html>
